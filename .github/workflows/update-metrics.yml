name: Update metrics

on:
  schedule:
    # Daily 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet requests scholarly

      - name: Refresh metrics.json
        run: python scripts/update_metrics.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/metrics.json; then
            echo "No metrics changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics.json
          git commit -m "chore: refresh GitHub stars and Scholar citations"
          git push
